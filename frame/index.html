/* THE PREDICTOR theme.
   Opening: midnight arcade advertisement in chunky pixel type, pink/green cycling headline, twinkling pixels.
   Gameplay: warm cream single-column page, Mincho headings, fluorescent pink + acid-green accents,
   crisp pixel borders. Two deliberately different looks. */

  --cream: #F5F0E6;
  --paper: #FBF8F1;
  --ink: #252525;

  --lavender: #A69BCC;
  --pale-pink: #FFE0EF;
  --midnight: #0B0B1E;
  --midnight-2: #16163A;
  --muted: #6B6560;

  --charcoal: var(--ink);
  --gray: var(--face);
  --bluegray: var(--lavender);

/* Structural styles. Colors and fonts come only from theme.css tokens. */
*, *::before, *::after { box-sizing: border-box; }
html { min-height: 100%; background: var(--cream); }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  background-color: var(--cream);
  background-image: radial-gradient(rgba(37, 37, 37, .07) .6px, transparent .7px);
  background-size: 6px 6px;
  font: 16px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  -webkit-font-smoothing: antialiased;
}
body.is-opening { background: var(--midnight); padding-bottom: 0; }
h1, h2, h3, p { margin: 0; }
p { max-width: 62ch; }
a { color: inherit; }
#app { max-width: 680px; margin: 0 auto; }
body.is-opening #app { max-width: none; }

/* ================= OPENING: arcade advertisement ================= */
.screen-opening {
  position: relative; min-height: 100vh; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  display: grid; place-items: center; overflow: hidden;
  background:
    repeating-linear-gradient(to bottom, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse 80% 60% at 50% 45%, var(--midnight-2), var(--midnight) 75%);
  color: #F5F0E6;
}
.stars { position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(var(--green) 1.5px, transparent 1.6px), radial-gradient(var(--pink) 1.5px, transparent 1.6px), radial-gradient(#F5F0E6 1px, transparent 1.1px);
  background-size: 210px 170px, 290px 230px, 130px 110px;
  background-position: 30px 40px, 120px 90px, 60px 20px;
  animation: twinkle 2.4s steps(2, end) infinite; opacity: .8;
}
@keyframes twinkle { 50% { opacity: .35; } }
.opening-inner { position: relative; z-index: 1; width: 100%; max-width: 1100px; padding: 48px max(20px, env(safe-area-inset-left, 0px)) 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; container-type: inline-size; }
.op-title { font: 700 clamp(16px, 2.6cqi, 26px)/1 var(--font-pixel); letter-spacing: .24em; color: var(--lavender); }
.op-prize { display: flex; flex-direction: column; align-items: center; gap: .1em; font-family: var(--font-pixel); font-weight: 700; line-height: .95; text-transform: uppercase; }
.op-lead { font-size: clamp(28px, 7.4cqi, 90px); color: #F5F0E6; letter-spacing: .04em; }
.op-amount { font-size: clamp(34px, 12.6cqi, 170px); letter-spacing: -.04em; white-space: nowrap; color: var(--pink);
  text-shadow: .05em .05em 0 #000; animation: neon 1.6s steps(1, end) infinite; }
@keyframes neon { 50% { color: var(--green); } }
.cursor { display: inline-block; width: .12em; height: .8em; margin-left: .06em; vertical-align: -.02em; background: #F5F0E6; animation: blink 1s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.op-sub { font: italic 500 clamp(18px, 3cqi, 28px)/1.3 var(--font-mincho); color: #F5F0E6; }
.screen-opening .op-start {
  margin-top: 10px; min-height: 72px; padding: 14px 40px; gap: 14px;
  font: 700 clamp(22px, 3.6cqi, 34px)/1 var(--font-pixel); letter-spacing: .08em; color: var(--midnight);
  background: var(--green); border: 0; box-shadow: 0 0 0 3px #F5F0E6, 8px 8px 0 3px var(--pink);
}
.screen-opening .op-start:hover { background: var(--pink); color: #fff; box-shadow: 0 0 0 3px #F5F0E6, 8px 8px 0 3px var(--green); }
.screen-opening .op-start:active { transform: translate(4px, 4px); box-shadow: 0 0 0 3px #F5F0E6, 4px 4px 0 3px var(--pink); }
.screen-opening .op-start:focus-visible { outline: 3px dashed #F5F0E6; outline-offset: 10px; }
.op-start .arrow { font-size: .7em; }
.op-disclaimer { font: 13px var(--font-body); color: #F5F0E6; opacity: .7; }
.op-about { margin-top: 18px; font: 700 18px var(--font-pixel); letter-spacing: .06em; color: var(--lavender); text-decoration: none; border-bottom: 2px solid currentColor; padding-bottom: 2px; }
.op-about:hover { color: var(--green); }
.screen-opening .qr { color: #F5F0E6; }

/* ================= GAMEPLAY: light single column ================= */
.screen { display: flex; flex-direction: column; }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0 12px; border-bottom: 2px solid var(--ink); }
.brand { font: 700 15px/1 var(--font-pixel); letter-spacing: .16em; color: var(--pink-ink); }
.progress { display: flex; gap: 5px; }
.progress i { width: 12px; height: 12px; border: 2px solid var(--ink); background: var(--paper); }
.progress i.done { background: var(--ink); }
.progress i.now { background: var(--pink); }
.page-body { display: flex; flex-direction: column; gap: 22px; padding: 30px 0 10px; }
.page-foot { display: flex; justify-content: center; gap: 22px; padding: 28px 0 0; margin-top: 18px; border-top: 1px dotted var(--ink); font-size: 14px; }
.page-foot a { text-decoration: none; border-bottom: 1px solid var(--pink); }
.page-foot a:hover { color: var(--pink-ink); }

/* Headings and text */
.eyebrow, .eyebrow-dark, .step { font: 700 13px/1.4 var(--font-pixel); letter-spacing: .14em; text-transform: uppercase; color: var(--pink-ink); }
.prompt, .question, .warmup-q {
  font-family: var(--font-mincho); font-weight: 800; color: var(--ink);
  font-size: clamp(30px, 6.4vw, 46px); line-height: 1.15; text-wrap: balance; letter-spacing: -.005em;
}
.prompt-xl { font-size: clamp(38px, 8.6vw, 64px); color: var(--pink); }
.question { font-size: clamp(24px, 4.6vw, 32px); }
.stage-body, .body, .tension, .note, .intro { color: var(--ink); }
.stage-body { font-size: 17px; }
.stage-body.big { font-family: var(--font-mincho); font-weight: 700; font-size: clamp(20px, 3.4vw, 26px); line-height: 1.35; }
.hl, .reveal-pred { color: var(--pink-ink); }
.note { font-size: 14px; color: var(--muted); }
.rule { height: 0; border: 0; border-top: 3px double var(--ink); margin: 0; }

/* The old dark "stage" blocks become plain heading groups in the column */
.stage { display: flex; flex-direction: column; gap: 12px; }
.stage-center { align-items: center; text-align: center; }
.stage-center p { margin-inline: auto; }
.stage::after { content: ""; display: block; width: 72px; height: 6px; margin-top: 6px; background: linear-gradient(90deg, var(--pink) 0 50%, var(--green) 50%); }
.stage-center::after { margin-inline: auto; }
.illus { display: flex; justify-content: center; }
.px-computer { display: block; width: 64px; height: 64px; background: var(--px-computer) 0 0 / 64px 64px no-repeat; image-rendering: pixelated; }

/* Buttons: refined retro controls */
.actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; }
.options { display: flex; flex-direction: column; gap: 14px; }
.options-final { flex-direction: row; flex-wrap: wrap; }
.options-final .btn { flex: 1 1 240px; }
.btn {
  font: 700 16px/1.25 var(--font-body); color: var(--ink); text-decoration: none; cursor: pointer; text-align: left;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  min-height: 52px; padding: 12px 20px; background: var(--paper); border: 0; border-radius: 0;
  box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 2px var(--ink);
  transition: transform .05s, box-shadow .05s, background .1s;
}
.btn:hover { background: var(--pale-pink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 2px var(--ink), 1px 1px 0 2px var(--ink); }
.btn:focus-visible { outline: 3px dashed var(--pink); outline-offset: 6px; }
.btn-primary { background: var(--green); }
.btn-primary:hover { background: var(--pink); color: #fff; }
.btn-key { font: 700 13px/1 var(--font-pixel); min-width: 24px; padding: 4px 0; text-align: center; background: var(--ink); color: var(--paper); }
.btn-primary:hover .btn-key { background: #fff; color: var(--pink-ink); }
.options .btn { width: 100%; justify-content: flex-start; min-height: 60px; font-size: 17px; }
.btn-choice { min-height: 92px !important; justify-content: center !important; }
.btn-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.btn-choice .btn-label { font: 700 clamp(20px, 3.4vw, 26px)/1.1 var(--font-pixel); letter-spacing: .04em; }
.btn-hint { font-size: 13px; font-weight: 400; }

  function welcomeScreen({ onAnswer }) {

  function revealScreen({ result, onNext, onSkip }) {
    const v = VERDICTS[`${result.prediction}|${result.choice}`];
    return appWindow({

        ),

  function rematchScreen({ result, onPick }) {
    const other = result.choice === CHOICE.ONLY_B ? CHOICE.BOTH : CHOICE.ONLY_B;
    return appWindow({
      screenClass: "screen-rematch",
      file: "REMATCH.EXE",
      status: ["NEW HYPOTHETICAL ROUND", "STEP 5 OF 6", "PRESS 1 OR 2"],
      body: [
        h(
          "div",
          { class: "stage" },
          h("h2", { class: "prompt" }, REMATCH.title),
          h("div", { class: "accuracy-swap" }, h("span", { class: "acc acc-old" }, pct(MAIN_ACCURACY)), h("span", { class: "acc-arrow" }, "\u2192"), h("span", { class: "acc acc-new" }, pct(REMATCH_ACCURACY))),
          h("p", { class: "stage-body" }, REMATCH.body)
        ),
        h("h3", { class: "question" }, REMATCH.question),
        h(
          "div",
          { class: "options options-final" },
          h(
            "button",
            { class: "btn btn-primary btn-choice", type: "button", onclick: () => onPick("SAME"), dataset: { key: "1" } },
            h("span", { class: "btn-key", "aria-hidden": "true" }, "1"),
            h("span", { class: "btn-stack" }, h("span", { class: "btn-label" }, REMATCH.same), h("span", { class: "btn-hint" }, `Still ${CHOICE_SHORT[result.choice].toLowerCase()}`))
          ),
          h(
            "button",
            { class: "btn btn-primary btn-choice", type: "button", onclick: () => onPick("SWITCH"), dataset: { key: "2" } },
            h("span", { class: "btn-key", "aria-hidden": "true" }, "2"),
            h("span", { class: "btn-stack" }, h("span", { class: "btn-label" }, REMATCH.switch), h("span", { class: "btn-hint" }, `Change to ${CHOICE_SHORT[other].toLowerCase()}`))
          )
        )
      ]
    });
  }
  function rematchRevealScreen({ rematch, onNext }) {
    const row = (acc) => {
      const one = expectedValue(CHOICE.ONLY_B, acc);
      const both = expectedValue(CHOICE.BOTH, acc);
      return h(
        "tr",
        {},
        h("th", { scope: "row" }, `${pct(acc)} Predictor`),
        h("td", { class: one > both ? "win" : "" }, formatMoney(one)),
        h("td", { class: both > one ? "win" : "" }, formatMoney(both))
      );
    };
    return appWindow({
      screenClass: "screen-rematch-reveal",
      file: "EXPECTED.VAL",
      status: ["HYPOTHETICAL ROUND COMPLETE", "STEP 5 OF 6"],
      body: [
        h(
          "div",
          { class: "stage" },
          h("p", { class: "eyebrow-dark" }, REMATCH.hypothetical),
          h(
            "p",
            { class: "stage-body big" },
            `You ${rematch.pick === "SAME" ? "kept" : "switched to"} ${CHOICE_SHORT[rematch.choice].toLowerCase()}. The 50% Predictor guessed ${CHOICE_SHORT[rematch.prediction].toLowerCase()}, so you'd get `,
            h("span", { class: "hl" }, formatMoney(rematch.payout)),
            "."
          )
        ),
        h(
          "div",
          { class: "ev-wrap" },
          h(
            "table",
            { class: "ev" },
            h("caption", {}, REMATCH.evTitle),
            h("thead", {}, h("tr", {}, h("th", {}, ""), h("th", { scope: "col" }, "One box"), h("th", { scope: "col" }, "Both boxes"))),
            h("tbody", {}, row(MAIN_ACCURACY), row(REMATCH_ACCURACY))
          )
        ),
        h(
          "ul",
          { class: "rules" },
          h("li", {}, `At 95% accuracy, taking one box has an expected payoff of ${formatMoney(expectedValue(CHOICE.ONLY_B, 0.95))}, versus ${formatMoney(expectedValue(CHOICE.BOTH, 0.95))} for taking both.`),
          h("li", {}, `At 50% accuracy, taking both has a ${formatMoney(expectedValue(CHOICE.BOTH, 0.5) - expectedValue(CHOICE.ONLY_B, 0.5))} expected advantage.`)
        ),
        h("p", { class: "tension" }, REMATCH.evNote),
        h("div", { class: "actions" }, button(REMATCH.next, { onClick: onNext, variant: "primary", key: "\u21B5" }))
      ]
    });
  }
  function resultsScreen({ result, share, gameUrl, showQr, onCopy, onAgain }) {
    const t = RESULTS.titles[result.choice];
    const tally = h("div", { class: "tally", "aria-live": "polite" }, h("p", { class: "note" }, "Loading tally\u2026"));
    const copyStatus = h("p", { class: "copy-status", "aria-live": "polite" });
    const fallback = h("textarea", { class: "copy-fallback", readonly: true, rows: 5, hidden: true, "aria-label": "Result text" }, share.plain);
    return {
      node: appWindow({
        screenClass: "screen-results",
        file: "RESULTS.DB",
        status: ["GAME OVER", "STEP 6 OF 6", "PRESS ENTER TO PLAY AGAIN"],
        body: [
          h(
            "div",
            { class: "stage stage-center" },
            h("img", { class: "deco-heart", src: ICON.heartPlanet, alt: "" }),
            h("p", { class: "eyebrow-dark" }, "You are"),
            h("h2", { class: "prompt prompt-xl" }, t.name),
            h("p", { class: "stage-body" }, t.line)
          ),
          h(
            "dl",
            { class: "facts" },
            h("div", { class: "fact" }, h("dt", {}, RESULTS.choice), h("dd", {}, CHOICE_SHORT[result.choice])),
            h("div", { class: "fact money" }, h("dt", {}, RESULTS.payout), h("dd", {}, breakable(formatMoney(result.payout))))
          ),
          tally,
          h("div", { class: "actions" }, button(RESULTS.again, { onClick: onAgain, variant: "primary", key: "\u21B5" }), button(RESULTS.copy, {
            onClick: async () => {
              const ok = await onCopy();
              copyStatus.textContent = ok ? RESULTS.copied : RESULTS.copyFailed;
              fallback.hidden = ok;
              if (!ok) fallback.select();
            }
          })),
          copyStatus,
          fallback,
          CONFIG.worldUrl ? h(
            "div",
            { class: "stage stage-center meet" },
            h("h2", { class: "prompt" }, RESULTS.meetTitle),
            h("a", { class: "btn btn-primary btn-big", href: CONFIG.worldUrl }, h("img", { class: "btn-icon", src: ICON.www, alt: "" }), h("span", { class: "btn-label" }, RESULTS.meetCta))
          ) : null,
          showQr ? qr(gameUrl, WELCOME.phoneCta) : null
        ]
      }),
      tally
    };
  }
  function fillTally(el, { source, offline, agg }) {
    el.replaceChildren();
    if (!agg.total) {
      el.append(h("p", { class: "note" }, RESULTS.tallyEmpty));
      return;
    }
    const p = percent(agg.onlyB, agg.total);
    el.append(
      h("p", { class: "tally-line" }, h("span", { class: "tally-num" }, `${p}%`), ` ${source === "live" ? RESULTS.tallyLive : RESULTS.tallyLocal}`),
      h("span", { class: "bar-track", role: "img", "aria-label": `${p} percent took one box` }, h("span", { class: "bar-fill", style: `width:${p}%` })),
      h("p", { class: "note" }, `${agg.total} ${agg.total === 1 ? "game" : "games"}. ${source === "local" ? RESULTS.localNote : ""}${offline ? " Shared results unavailable." : ""}`)
    );
  }

  // src/ui/sound.js
  var ctx = null;
  function audio() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = AC ? new AC() : null;
    } catch {
      ctx = null;
    }
    return ctx;
  }
  function tone(ac, { type, from, to, start, dur, gain = 0.08 }) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(from, start);
    if (to) o.frequency.exponentialRampToValueAtTime(to, start + dur);
    g.gain.setValueAtTime(1e-4, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.01);
    g.gain.exponentialRampToValueAtTime(1e-4, start + dur);
    o.connect(g).connect(ac.destination);
    o.start(start);
    o.stop(start + dur + 0.02);
  }
  function playSound(kind = "bloop") {
    const ac = audio();
    if (!ac) return;
    try {
      if (ac.state === "suspended") ac.resume();
      const t = ac.currentTime + 0.01;
      if (kind === "bleep") {
        tone(ac, { type: "square", from: 880, start: t, dur: 0.06, gain: 0.05 });
        tone(ac, { type: "square", from: 1320, start: t + 0.07, dur: 0.08, gain: 0.05 });
      } else if (kind === "start") {
        [523, 659, 784, 1047].forEach((f, i) => tone(ac, { type: "square", from: f, start: t + i * 0.08, dur: 0.09, gain: 0.045 }));
      } else {
        tone(ac, { type: "sine", from: 520, to: 220, start: t, dur: 0.16, gain: 0.12 });
      }
    } catch {
    }
  }

  // src/ui/app.js
  function safeStorage() {
    try {
      const s = window.localStorage;
      s.getItem("x");
      return s;
    } catch {
      return null;
    }
  }
  function startApp(root, config = CONFIG) {
    const storage = safeStorage();
    const stats = new StatsService({
      local: new LocalAdapter(storage),
      remote: config.statsEndpoint ? new RemoteAdapter({ endpoint: config.statsEndpoint, fetchImpl: window.fetch.bind(window), storage }) : null
    });
    stats.retryQueued();
    window.addEventListener("online", () => stats.retryQueued());
    const booth = location.hash === "#booth";
    const gameUrl = config.gameUrl || location.href.split("#")[0];
    const wideScreen = window.matchMedia("(min-width: 700px)").matches;
    const session = createSession();
    const idle = new IdleTimer({ ms: booth ? config.boothIdleMs : 0, onIdle: () => restart() });
    function show(node) {
      document.body.classList.toggle("is-opening", node.classList.contains("screen-opening"));
      root.replaceChildren(node);
      window.scrollTo?.(0, 0);
      root.querySelector(".btn-primary, .btn")?.focus({ preventScroll: true });
      idle.poke();
    }
    let opened = false;
    function restart() {
      session.reset();
      opened = false;
      render();
    }
    function go(fn) {
      return (...args) => {
        fn(...args);
        render();
      };
    }
    function render() {
      switch (session.phase) {
        case PHASE.WELCOME:
          if (!opened) {
            document.body.classList.add("is-opening");
            return show(openingScreen({ onStart: () => {
              opened = true;
              render();
            }, gameUrl, showQr: wideScreen }));
          }
          return show(welcomeScreen({ onAnswer: go((o) => session.answerCalibration(o)) }));
        case PHASE.RULES:
          return show(rulesScreen({ onNext: go(() => session.toDecision()) }));
        case PHASE.DECIDE:
          return show(
            decideScreen({
              onChoose: go((c) => {
                const result = session.choose(c);
                stats.record(result);
              })
            })
          );
        case PHASE.REVEAL:
          return show(revealScreen({ result: session.result(), onNext: go(() => session.toRematch()), onSkip: go(() => session.toResults()) }));
        case PHASE.REMATCH:
          return show(rematchScreen({ result: session.result(), onPick: go((p) => session.rematch(p)) }));
        case PHASE.REMATCH_REVEAL:
          return show(rematchRevealScreen({ rematch: session.rematchResult(), onNext: go(() => session.toResults()) }));
        case PHASE.RESULTS: {
          const result = session.result();
          const share = buildShare(result, gameUrl);
          const view = resultsScreen({ result, share, gameUrl, showQr: wideScreen, onCopy: () => copyText(share.plain), onAgain: restart });
          show(view.node);
          const id = session.id;
          stats.room().then((room) => {
            if (session.id === id && view.tally.isConnected) fillTally(view.tally, room);
          });
          return;
        }
      }
    }
    document.addEventListener("keydown", (e) => {
      idle.poke();
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const btn = root.querySelector(`[data-key="${e.key}"]`);
      if (btn) {
        e.preventDefault();
        btn.click();
      }
    });
    document.addEventListener(
      "pointerdown",
      (e) => {
        const b = e.target.closest?.("button, a.btn, a.op-about");
        if (!b || !root.contains(b)) return;
        playSound(b.dataset.sound || (b.classList.contains("btn-primary") ? "bleep" : "bloop"));
      },
      { passive: true }
    );
    ["pointerdown", "touchstart"].forEach((t) => document.addEventListener(t, () => idle.poke(), { passive: true }));
    render();
    return { session, stats };
  }
  if (typeof document !== "undefined") {
    const root = document.getElementById("app");
    if (root) startApp(root);
  }
})();
